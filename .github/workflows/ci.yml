name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Both systems build and test everything. Windows matters: its checkout writes CRLF line endings and its
    # java.exe reads the command line in the ANSI code page, which is where the jar's bytes and the CLI's
    # arguments could differ from Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      # Builds and tests the core and the CLI, and builds cli/build/libs/session-porter.jar.
      - run: ./gradlew build
      # The jar committed in plugin/lib/ (and its .sha256) must be the one these sources build.
      - run: ./gradlew verifyPluginJar
      # The launchers of the plugin run against that jar; the PowerShell part runs where pwsh is installed.
      - run: sh plugin/tests/test-launchers.sh
      # The jar must be the same bytes on every system: its hash goes to the next job, which compares them.
      - run: sha256sum cli/build/libs/session-porter.jar | cut -d ' ' -f 1 > jar-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jar-sha256-${{ matrix.os }}
          path: jar-sha256.txt

  same-jar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-sha256-*
      - run: |
          cat jar-sha256-*/jar-sha256.txt
          test "$(cat jar-sha256-*/jar-sha256.txt | sort -u | wc -l)" = 1

  validate-plugin:
    # The checks of Claude Code itself on the marketplace and on the plugin; they need no login.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugin
