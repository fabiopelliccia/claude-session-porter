# 简体中文。包含 {0}、{1} 等占位符的键由 MessageFormat 处理：仅在这些键中，字面撇号需要写成两个 ('')。

conflict.skip=跳过已存在的会话
conflict.replace=替换现有会话
conflict.duplicate=作为新副本导入（新 id）
progress.exportingSession=正在导出 {0}
progress.exportCompleted=导出完成
progress.importingSession=正在导入 {0}
progress.importCompleted=导入完成
export.warning.noTranscript={0}：未找到对话记录，已跳过
export.warning.unreadable={0}：无法读取 {1}，归档中缺少该文件
export.warning.partialLine={0}：{1} 的最后一行仍在写入中，已从归档中排除
import.warning.noTranscript={0}：归档中缺少对话记录，已跳过
error.notAnArchive=这不是 Claude Code 会话归档：缺少 manifest.json
error.notClaudeArchive=这不是 Claude Code 会话归档（创建者："{0}"）：其中没有 Claude Code 对话记录。
error.unreadableManifest=无法读取 manifest.json
error.archiveTooNew=归档格式 {0} 比支持的版本 {1} 更新。请更新插件。
error.targetRequired=此归档隐藏了创建它的计算机的路径：请选择要关联会话的项目文件夹。
log.section.environment=环境
log.section.context=操作上下文
log.section.sessions=会话
log.section.diagnosis=可见性诊断
log.section.comparison=与本机会话的比较
log.section.summary=摘要
diagnosis.check.1=对话记录存在、可读取且不为空
diagnosis.check.2=对话记录的每一行都是有效的 JSON
diagnosis.check.3=对话记录中的每个会话 id 都与文件名一致
diagnosis.check.4=对话记录位于 Claude Code 为其工作目录读取的项目文件夹中
diagnosis.check.5=已记录工作目录 (cwd)
diagnosis.check.6=每个 cwd 都是所关联的文件夹或位于其下
diagnosis.check.7=每个 cwd 都是规范形式（平台分隔符，末尾无分隔符）
diagnosis.check.8=cwd 文件夹在本机上存在
diagnosis.check.9=对话记录至少包含一条侧链之外的用户或助手消息
diagnosis.check.10=对话记录以换行符结尾，Claude Code 可以继续追加行
diagnosis.check.11=没有与计算机相关的路径仍指向源计算机的文件夹
diagnosis.check.12=时间戳位于导入时刻，且没有未来的时间
diagnosis.check.13=检查点引用的所有文件历史备份均存在
diagnosis.check.14=导入的文件中没有残留匿名化令牌
