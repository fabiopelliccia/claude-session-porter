# Texts of the Session Porter core, in English: this file is both the default bundle and the fallback used for
# every key a translation does not carry.
#
# Keys whose text contains a {0}, {1}... placeholder are rendered through java.text.MessageFormat:
# in those - and only in those - a literal apostrophe has to be doubled ('').

# --- conflict policies
conflict.skip=Skip sessions that already exist
conflict.replace=Replace the existing session
conflict.duplicate=Import as a new copy (new id)

# --- progress
progress.exportingSession=Exporting {0}
progress.exportCompleted=Export completed
progress.importingSession=Importing {0}
progress.importCompleted=Import completed

# --- export and import warnings
export.warning.noTranscript={0}: transcript not found, skipped
export.warning.unreadable={0}: {1} could not be read and is missing from the archive
export.warning.partialLine={0}: the last line of {1} was still being written and was left out of the archive
import.warning.noTranscript={0}: the transcript is missing from the archive, skipped

# --- errors
error.notAnArchive=Not a Claude Code session archive: manifest.json is missing
error.notClaudeArchive=This is not a Claude Code session archive (created by "{0}"): it holds no Claude Code transcripts.
error.unreadableManifest=Unreadable manifest.json
error.archiveTooNew=Archive format {0} is newer than the supported version {1}. Please update the plugin.
error.targetRequired=This archive hides the paths of the machine that made it: choose the project folder to attach the sessions to.

# --- import log: section titles and visibility checks (the numbers are a contract, see TASK.md)
log.section.environment=Environment
log.section.context=Operation context
log.section.sessions=Sessions
log.section.diagnosis=Visibility diagnosis
log.section.comparison=Comparison with a native session
log.section.summary=Summary
diagnosis.check.1=The transcript exists, is readable and is not empty
diagnosis.check.2=Every line of the transcript is valid JSON
diagnosis.check.3=Every session id in the transcript matches the file name
diagnosis.check.4=The transcript is in the project folder Claude Code reads for its working directory
diagnosis.check.5=A working directory (cwd) is recorded
diagnosis.check.6=Every cwd is the attached folder or lies below it
diagnosis.check.7=Every cwd is in canonical form (platform separators, no trailing separator)
diagnosis.check.8=The cwd folder exists on this machine
diagnosis.check.9=The transcript holds at least one user or assistant message outside sidechains
diagnosis.check.10=The transcript ends with a newline, so Claude Code can append to it
diagnosis.check.11=No machine facing path still points to the folder of the source machine
diagnosis.check.12=The timestamps land at import time and none is in the future
diagnosis.check.13=Every file history backup referenced by the checkpoints is present
diagnosis.check.14=No anonymization token is left in the imported files
