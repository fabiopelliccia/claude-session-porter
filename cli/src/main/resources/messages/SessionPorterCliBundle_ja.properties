error.usage.outNotZip="{0}" は .zip のファイル名ではありません。.zip で終わるファイル、またはフォルダ (既存のもの、または / か \\ で終わる名前) を指定してください。
error.usage.outIsFolder="{0}" はフォルダであり、アーカイブファイルではありません。
