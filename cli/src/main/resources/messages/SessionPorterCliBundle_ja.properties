error.usage.noCommand=コマンドが指定されていません。コマンド: list, inspect, export, import, doctor, version。
error.usage.optionBeforeCommand=コマンドの前に未知のオプション "{0}" があります。ここに置けるのは --home, --json, --lang, --verbose だけです。
error.usage.unknownCommand=未知のコマンド "{0}" です。
error.usage.unknownOption=オプション "{0}" は {1} コマンドでは使えません。
error.usage.missingValue=オプション {0} には値が必要です。
error.usage.unexpectedValue=オプション {0} は値を取りません。
error.usage.repeatedOption=オプション {0} が複数回指定されました。
error.usage.missingArgument={0} コマンドには {1} が必要です。
error.usage.unexpectedArgument=予期しない引数 "{0}" です。
error.usage.invalidNumber={0} の値 "{1}" は 1 以上の整数ではありません。
error.usage.invalidSince="{0}" を日付として読み取れません。ISO の日付または日時、あるいは 7d、12h、2w のような期間を使ってください。
error.usage.invalidLanguage="{0}" は有効な言語タグではありません (例: en, it, pt-BR)。
