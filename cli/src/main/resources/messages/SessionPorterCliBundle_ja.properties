error.usage.keepOriginalNeedsFormat1=--keep-original-folder は形式 1 のアーカイブにのみ適用されます。このアーカイブは元のパスを隠しているため、代わりに --target を指定してください。
error.usage.targetAndKeepOriginal=--target と --keep-original-folder は同時に使えません。どちらか一方を使ってください。
error.usage.invalidPath=パス "{0}" はこのシステムでは無効です。
